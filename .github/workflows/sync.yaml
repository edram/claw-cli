name: Mirror Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load mirrors config
        id: mirrors
        run: |
          MIRRORS=$(cat .github/mirrors.json)
          echo "config<<EOF" >> $GITHUB_OUTPUT
          echo "$MIRRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read mirrors config and sync
        run: |
          git fetch --all

          echo '${{ steps.mirrors.outputs.config }}' | jq -c '.[]' | while read -r item; do
            BRANCH=$(echo "$item" | jq -r '.branch')
            SOURCE=$(echo "$item" | jq -r '.source')
            SOURCE_BRANCH=$(echo "$item" | jq -r '.source_branch')

            echo "▶ Syncing $SOURCE ($SOURCE_BRANCH) → branch/$BRANCH"

            if ! git remote | grep -q "^${BRANCH}$"; then
              git remote add "$BRANCH" "$SOURCE"
            fi

            git fetch "$BRANCH" "$SOURCE_BRANCH"

            if ! git show-ref --quiet "refs/heads/$BRANCH"; then
              echo "  ○ Branch $BRANCH does not exist, creating from source"
              git checkout -b "$BRANCH" "$BRANCH/$SOURCE_BRANCH"
            else
              echo "  ● Branch $BRANCH exists, rebasing onto latest source"
              git checkout "$BRANCH"
              git rebase "$BRANCH/$SOURCE_BRANCH"
            fi
          done

      - name: Push all mirror branches
        run: |
          FAILED=0

          while read -r BRANCH; do
            echo "⬆ Pushing $BRANCH"
            if ! git push origin "$BRANCH"; then
              echo "✗ Push failed for $BRANCH"
              FAILED=1
            fi
          done < <(echo '${{ steps.mirrors.outputs.config }}' | jq -r '.[].branch')

          if [ $FAILED -ne 0 ]; then
            echo "One or more branches failed to push"
            exit 1
          fi